[/Script/RemoteControlCommon.RemoteControlSettings]
; --- unreal-mcp ---
; The server listens on 127.0.0.1 only: nothing is exposed outside the machine.
bAutoStartWebServer=True
bAutoStartWebSocketServer=True
RemoteControlHttpServerPort=30010

; Unlocks the PythonScriptLibrary object (FRemoteControlModule::CanBeAccessedRemotely).
bEnableRemotePythonExecution=True

; Unlocks the function call (WebRemoteControlInternalUtils::ValidateFunctionCall).
; Targeted allowlist: only this class, instead of bAllowAnyRemoteFunctionCall=True
; which would expose every UFUNCTION in the project to HTTP calls.
; On engines that predate these keys they are simply ignored.
bAllowAnyRemoteFunctionCall=False
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/PythonScriptPlugin.PythonScriptLibrary")

; Deliberately off: this enables ExecuteConsoleCommand *through the web API*,
; which the bridge never uses. The console commands it does need
; (LiveCoding.Compile, WebControl.StartServer, HighResShot) are issued from
; inside Python via unreal.SystemLibrary.execute_console_command and do not go
; through this gate.
bAllowConsoleCommandRemoteExecution=False
