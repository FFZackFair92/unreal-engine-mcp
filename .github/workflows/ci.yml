name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are on their v7 lines because v5/v6 moved the runtime to Node 24;
# staying on the older majors means every run logs a Node 20 deprecation
# warning. Neither breaking change touches this workflow: `pip-install` was
# dropped from setup-python v7 and we use `cache: pip`, and checkout v7 only
# restricts fork checkouts under pull_request_target / workflow_run, which
# this workflow does not use.
jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The suite stands in for Unreal with a fake `unreal` module and a fake
      # Remote Control server, so it runs anywhere — no engine install needed.
      - name: Test
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
